[project]
name = "rag-thesis"
version = "0.1.0"
description = "Serverless RAG pipelines on AWS: performance and cost experiments (UW Tacoma MS thesis)"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.40",
  "pydantic>=2.7",
  "pyyaml>=6",
]

[project.optional-dependencies]
infra = ["aws-cdk-lib>=2.220", "constructs>=10"]
analysis = ["pandas>=2.2", "pyarrow>=16", "matplotlib>=3.9"]
dev = ["pytest>=8"]

[project.scripts]
rag = "rag_harness.cli:main"

[tool.setuptools.packages.find]
where = ["harness", "configs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["configs", "harness", "lambdas/src", "."]
